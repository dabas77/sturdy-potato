<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portfolio | Vansh Dabas &amp; Priyanshu Sehrawat</title>
  
  <!-- Inter font for executive minimalist typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Base Ambiance */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background: #060709;
      background: radial-gradient(circle at 50% 50%, #15181f 0%, #0a0b0e 45%, #040507 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f3f7;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    /* Ambient Spotlight Depth Layer */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, rgba(229, 228, 226, 0.03) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      transition: opacity 0.5s ease;
    }

    /* 3D Scene Wrapper */
    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    /* Standard Playing Card Ratio: 2.5 x 3.5 (~1:1.4) */
    .card-wrapper {
      width: 320px;
      height: 448px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: grab;
      touch-action: pan-y pinch-zoom;
    }

    .card-wrapper:active {
      cursor: grabbing;
    }

    /* Internal Flip Core */
    .card-flipper {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    /* Card Faces (Matte Obsidian Body) */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: #0d0e12;
      background: linear-gradient(145deg, #121319 0%, #0a0b0e 100%);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(0, 0, 0, 0.6);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 42px 34px;
      overflow: hidden;
    }

    /* Subtle hairline metallic borders */
    .card-face.front {
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.9),
        inset 0 0 1px 1px rgba(212, 175, 55, 0.25),
        0 0 25px rgba(212, 175, 55, 0.08);
    }

    .card-face.back {
      transform: rotateY(180deg);
      border: 1px solid rgba(229, 228, 226, 0.45);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.9),
        inset 0 0 1px 1px rgba(229, 228, 226, 0.25),
        0 0 25px rgba(229, 228, 226, 0.08);
    }

    /* Dynamic sheen reflection on card movement */
    .card-sheen {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.04) 45%, transparent 60%);
      opacity: 0.6;
    }

    /* Content Layout & Hierarchy */
    .profile-info {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .name-heading {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .card-face.front .name-heading {
      color: #f7eed8;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .card-face.back .name-heading {
      color: #f2f4f7;
      text-shadow: 0 0 15px rgba(229, 228, 226, 0.15);
    }

    .class-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      opacity: 0.85;
      text-transform: uppercase;
    }

    .card-face.front .class-label {
      color: #dfcaa2;
    }

    .card-face.back .class-label {
      color: #b0b4bd;
    }

    .divider {
      width: 44px;
      height: 1.5px;
      border-radius: 2px;
      margin: 4px 0 6px 0;
    }

    .card-face.front .divider {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.7), transparent);
    }

    .card-face.back .divider {
      background: linear-gradient(90deg, rgba(229, 228, 226, 0.7), transparent);
    }

    .hobbies-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .hobbies-heading {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .card-face.front .hobbies-heading {
      color: #ecd5a7;
    }

    .card-face.back .hobbies-heading {
      color: #d1d5dc;
    }

    .hobbies-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hobbies-list li {
      font-size: 14px;
      font-weight: 400;
      color: #a4a8b2;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.01em;
    }

    .bullet-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .card-face.front .bullet-dot {
      background: #c9ab67;
      box-shadow: 0 0 6px rgba(201, 171, 103, 0.6);
    }

    .card-face.back .bullet-dot {
      background: #adb2bd;
      box-shadow: 0 0 6px rgba(173, 178, 189, 0.6);
    }

    /* Floating "Files" Button (Bottom-Left) */
    .files-button {
      position: fixed;
      bottom: 28px;
      left: 28px;
      z-index: 100;
      background: rgba(14, 15, 20, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f3f7;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.65);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      outline: none;
    }

    .files-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.85;
      transition: transform 0.3s ease;
    }

    .files-button:hover {
      transform: translateY(-3px) scale(1.05);
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(20, 22, 30, 0.9);
      box-shadow: 
        0 15px 30px -5px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .files-button:hover svg {
      transform: translateY(-1px);
    }

    .files-button:active {
      transform: translateY(0) scale(0.98);
    }

    /* In-Site Glassmorphic Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 5, 8, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      width: 100%;
      max-width: 980px;
      height: 86vh;
      background: #0d0f14;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.96) translateY(12px);
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .modal-backdrop.active .modal-container {
      transform: scale(1) translateY(0);
    }

    /* Modal Topbar */
    .modal-header {
      height: 52px;
      background: rgba(18, 20, 26, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #9da3af;
      text-transform: uppercase;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: scale(1.05);
    }

    .close-btn:active {
      transform: scale(0.95);
    }

    /* PDF Frame Viewport */
    .pdf-frame-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #08090c;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobile Responsiveness */
    @media (max-width: 480px) {
      .card-wrapper {
        width: 285px;
        height: 400px;
      }

      .card-face {
        padding: 34px 26px;
      }

      .name-heading {
        font-size: 22px;
      }

      .class-label {
        font-size: 13.5px;
      }

      .files-button {
        bottom: 20px;
        left: 20px;
        padding: 11px 20px;
        font-size: 13px;
      }

      .modal-backdrop {
        padding: 10px;
      }

      .modal-container {
        height: 92vh;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic ambient spotlight glow -->
  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- 3D Card Scene -->
  <main class="scene" id="sceneContainer">
    <div class="card-wrapper" id="cardWrapper">
      <div class="card-flipper" id="cardFlipper">
        
        <!-- Front Face: Vansh Dabas -->
        <section class="card-face front" aria-label="Profile of Vansh Dabas">
          <div class="card-sheen"></div>
          <div class="profile-info">
            <h1 class="name-heading">Vansh Dabas</h1>
            <p class="class-label">11th Humanities</p>
            <div class="divider"></div>
            
            <div class="hobbies-section">
              <h2 class="hobbies-heading">Hobbies</h2>
              <ul class="hobbies-list">
                <li><span class="bullet-dot"></span>Gaming</li>
                <li><span class="bullet-dot"></span>Watching movies</li>
                <li><span class="bullet-dot"></span>Tech</li>
              </ul>
            </div>
          </div>
        </section>

        <!-- Back Face: Priyanshu Sehrawat -->
        <section class="card-face back" aria-label="Profile of Priyanshu Sehrawat">
          <div class="card-sheen"></div>
          <div class="profile-info">
            <h1 class="name-heading">Priyanshu Sehrawat</h1>
            <p class="class-label">11th Humanities</p>
            <div class="divider"></div>
            
            <div class="hobbies-section">
              <h2 class="hobbies-heading">Hobbies</h2>
              <ul class="hobbies-list">
                <li><span class="bullet-dot"></span>Gaming</li>
                <li><span class="bullet-dot"></span>Football</li>
                <li><span class="bullet-dot"></span>Music</li>
              </ul>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Floating Files Button (Bottom-Left) -->
  <button class="files-button" id="filesBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Open documents viewer">
    <svg viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </svg>
    <span>Files</span>
  </button>

  <!-- In-Site PDF Viewer Modal -->
  <div class="modal-backdrop" id="pdfModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title">Document Viewer</span>
        <button class="close-btn" id="closeModalBtn" type="button" aria-label="Close document viewer">✕</button>
      </div>
      <div class="pdf-frame-wrapper">
        <iframe class="pdf-frame" id="pdfFrame" src="about:blank" title="Repository PDF Document"></iframe>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cardWrapper = document.getElementById('cardWrapper');
      const cardFlipper = document.getElementById('cardFlipper');
      const ambientGlow = document.getElementById('ambientGlow');
      const filesBtn = document.getElementById('filesBtn');
      const pdfModal = document.getElementById('pdfModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const pdfFrame = document.getElementById('pdfFrame');

      let isFlipped = false;
      let targetRotX = 0;
      let targetRotY = 0;
      let currentRotX = 0;
      let currentRotY = 0;

      // Function to trigger card flip
      const flipCard = () => {
        isFlipped = !isFlipped;
        cardFlipper.classList.toggle('is-flipped', isFlipped);
      };

      // 1. Right-Click Context Flip (Desktop)
      window.addEventListener('contextmenu', (e) => {
        // Prevent default browser menu only when outside modal
        if (!pdfModal.classList.contains('active')) {
          e.preventDefault();
          flipCard();
        }
      });

      // 2. 360° Mirror-Like Mouse Follow Rotation (Desktop)
      window.addEventListener('mousemove', (e) => {
        const { innerWidth, innerHeight } = window;
        const normX = (e.clientX / innerWidth) - 0.5; // -0.5 to 0.5
        const normY = (e.clientY / innerHeight) - 0.5; // -0.5 to 0.5

        // Smooth spatial tilt angles
        targetRotX = -normY * 28;
        targetRotY = normX * 36;

        // Move dynamic ambient spotlight
        ambientGlow.style.left = `${e.clientX}px`;
        ambientGlow.style.top = `${e.clientY}px`;
      });

      // Smooth Animation Loop using Lerp for fluidity
      const animateCard = () => {
        currentRotX += (targetRotX - currentRotX) * 0.08;
        currentRotY += (targetRotY - currentRotY) * 0.08;

        cardWrapper.style.transform = `rotateX(${currentRotX.toFixed(2)}deg) rotateY(${currentRotY.toFixed(2)}deg)`;
        requestAnimationFrame(animateCard);
      };
      animateCard();

      // Reset card tilt when cursor leaves viewport
      document.addEventListener('mouseleave', () => {
        targetRotX = 0;
        targetRotY = 0;
      });

      // 3. Touch Swipe Flip (Mobile & Tablet / iPad)
      let touchStartX = 0;
      let touchStartY = 0;
      let touchEndX = 0;
      let touchEndY = 0;

      cardWrapper.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchEndX = touch.clientX;
        touchEndY = touch.clientY;
      }, { passive: true });

      cardWrapper.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        touchEndX = touch.clientX;
        touchEndY = touch.clientY;

        // Subtle touch tilt reaction
        const deltaX = (touch.clientX / window.innerWidth) - 0.5;
        const deltaY = (touch.clientY / window.innerHeight) - 0.5;
        targetRotX = -deltaY * 20;
        targetRotY = deltaX * 25;
      }, { passive: true });

      cardWrapper.addEventListener('touchend', () => {
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // If horizontal swipe distance > 45px and dominant over vertical
        if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
          flipCard();
        }

        // Return tilt smoothly to center
        targetRotX = 0;
        targetRotY = 0;
      });

      // Click on card flipper also provides intuitive flip
      cardWrapper.addEventListener('click', (e) => {
        // Only flip if not dragging significantly
        const diffX = Math.abs(touchEndX - touchStartX);
        if (diffX < 15) {
          flipCard();
        }
      });

      // 4. Modal PDF Viewer Management
      const openModal = () => {
        if (pdfFrame.getAttribute('src') === 'about:blank') {
          // Point directly to document.pdf committed in the root repository
          pdfFrame.setAttribute('src', 'document.pdf');
        }
        pdfModal.classList.add('active');
        pdfModal.setAttribute('aria-hidden', 'false');
        filesBtn.setAttribute('aria-expanded', 'true');
      };

      const closeModal = () => {
        pdfModal.classList.remove('active');
        pdfModal.setAttribute('aria-hidden', 'true');
        filesBtn.setAttribute('aria-expanded', 'false');
      };

      filesBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openModal();
      });

      closeModalBtn.addEventListener('click', closeModal);

      // Close modal on backdrop click
      pdfModal.addEventListener('click', (e) => {
        if (e.target === pdfModal) {
          closeModal();
        }
      });

      // Keyboard accessibility (Escape key closes modal)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && pdfModal.classList.contains('active')) {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
