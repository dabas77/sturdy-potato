<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portfolio | Vansh Dabas &amp; Priyanshu Sehrawat</title>
  <style>
    :root {
      --bg: #07080b;
      --card-bg: #0d0f14;
      --gold-border: rgba(220, 185, 125, 0.45);
      --silver-border: rgba(215, 222, 235, 0.45);
      --text-main: #f5f5f7;
      --text-sub: #9ea4b0;
      --accent-gold: #e5c48b;
      --accent-silver: #d1d8e3;
      --btn-bg-start: #232733;
      --btn-bg-end: #161922;
      --border-btn: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      background: radial-gradient(circle at 50% 50%, #151821 0%, #08090d 75%, #040507 100%);
    }

    /* 3D Scene Wrapper */
    .scene {
      width: 320px;
      height: 480px;
      position: relative;
      perspective: 1400px;
      touch-action: none;
    }

    @media (min-width: 768px) {
      .scene {
        width: 340px;
        height: 510px;
      }
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      border-radius: 22px;
      cursor: grab;
      will-change: transform;
    }

    .card:active {
      cursor: grabbing;
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--card-bg);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }

    /* Front side - Champagne Gold hairline */
    .face-front {
      border: 1px solid var(--gold-border);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 20px rgba(229, 196, 139, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      transform: rotateY(0deg) translateZ(1px);
      -webkit-transform: rotateY(0deg) translateZ(1px);
    }

    /* Back side - Platinum Silver hairline */
    .face-back {
      border: 1px solid var(--silver-border);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 20px rgba(209, 216, 227, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      transform: rotateY(180deg) translateZ(1px);
      -webkit-transform: rotateY(180deg) translateZ(1px);
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
      margin-bottom: 6px;
      text-align: left;
    }

    .stream {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 24px;
      text-align: left;
    }

    .face-front .stream {
      color: var(--accent-gold);
    }

    .face-back .stream {
      color: var(--accent-silver);
    }

    .divider {
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02));
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 14px;
      text-align: left;
    }

    .hobbies-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .hobbies-list li {
      font-size: 15px;
      font-weight: 400;
      color: #cfd4dc;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bullet {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-sub);
      display: inline-block;
    }

    .face-front .bullet {
      background: var(--accent-gold);
    }

    .face-back .bullet {
      background: var(--accent-silver);
    }

    /* Floating Files Button (Bottom-Right) */
    .files-btn {
      position: fixed;
      bottom: calc(36px + env(safe-area-inset-bottom));
      right: calc(36px + env(safe-area-inset-right));
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--btn-bg-start), var(--btn-bg-end));
      border: 1px solid var(--border-btn);
      border-radius: 999px;
      color: #f1f3f7;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.6),
        0 0 15px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, background 0.25s ease;
      touch-action: manipulation;
    }

    .files-btn:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 
        0 16px 36px rgba(0, 0, 0, 0.75),
        0 0 20px rgba(220, 185, 125, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      border-color: rgba(220, 185, 125, 0.4);
    }

    .files-btn:active {
      transform: scale(0.97);
    }

    .files-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Files Modal / Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 5, 8, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      padding: 20px;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(160deg, #181b24 0%, #10121a 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: scale(0.94) translateY(12px);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-backdrop.open .modal-panel {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aeb4c0;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      transform: scale(1.05);
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Document Item Link */
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .file-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(220, 185, 125, 0.35);
      transform: translateY(-1px);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .file-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(220, 185, 125, 0.1);
      border: 1px solid rgba(220, 185, 125, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
    }

    .file-name {
      font-size: 15px;
      font-weight: 600;
      color: #f5f6fa;
      margin-bottom: 3px;
    }

    .file-meta {
      font-size: 12px;
      color: var(--text-sub);
    }

    .open-tag {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- 3D Card Scene -->
  <div class="scene" id="scene">
    <div class="card" id="card">
      <!-- Front: Vansh Dabas -->
      <div class="card-face face-front">
        <h1 class="name">Vansh Dabas</h1>
        <div class="stream">11th Humanities</div>
        <div class="divider"></div>
        <div class="section-title">Hobbies</div>
        <ul class="hobbies-list">
          <li><span class="bullet"></span>Gaming</li>
          <li><span class="bullet"></span>Watching movies</li>
          <li><span class="bullet"></span>Tech</li>
        </ul>
      </div>

      <!-- Back: Priyanshu Sehrawat -->
      <div class="card-face face-back">
        <h1 class="name">Priyanshu Sehrawat</h1>
        <div class="stream">11th Humanities</div>
        <div class="divider"></div>
        <div class="section-title">Hobbies</div>
        <ul class="hobbies-list">
          <li><span class="bullet"></span>Gaming</li>
          <li><span class="bullet"></span>Football</li>
          <li><span class="bullet"></span>Music</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Bottom-Right Files Button -->
  <button class="files-btn" id="filesBtn" aria-label="Open Files">
    <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
    Files
  </button>

  <!-- In-Site Files Drawer Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-panel" id="modalPanel">
      <div class="modal-header">
        <div class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-gold)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Documents
        </div>
        <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
      </div>
      <div class="file-list">
        <!-- Opens full multi-page PDF natively in new tab -->
        <a href="document.pdf" target="_blank" rel="noopener noreferrer" class="file-item">
          <div class="file-info">
            <div class="file-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <div>
              <div class="file-name">document.pdf</div>
              <div class="file-meta">Project Document • Full View</div>
            </div>
          </div>
          <div class="open-tag">
            Open ↗
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const card = document.getElementById('card');
      const scene = document.getElementById('scene');
      const filesBtn = document.getElementById('filesBtn');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const modalPanel = document.getElementById('modalPanel');
      const closeBtn = document.getElementById('closeBtn');

      // State Management
      let rotY = 0;
      let rotX = 0;
      let targetRotY = 0;
      let targetRotX = 0;
      
      let isDragging = false;
      let isAnimatingFlip = false;
      let startX = 0;
      let startY = 0;
      let initialRotY = 0;
      let initialRotX = 0;
      let dragDistance = 0;

      // Card rendering loop
      function updateTransform() {
        card.style.transform = `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
      }

      function lerp(start, end, factor) {
        return start + (end - start) * factor;
      }

      function renderLoop() {
        if (isAnimatingFlip) {
          rotY = lerp(rotY, targetRotY, 0.1);
          rotX = lerp(rotX, targetRotX, 0.1);
          
          if (Math.abs(rotY - targetRotY) < 0.05 && Math.abs(rotX - targetRotX) < 0.05) {
            rotY = targetRotY;
            rotX = targetRotX;
            isAnimatingFlip = false;
          }
          updateTransform();
        }
        requestAnimationFrame(renderLoop);
      }
      requestAnimationFrame(renderLoop);

      // Unified Pointer Events (Touch, Mouse, Pen)
      scene.addEventListener('pointerdown', (e) => {
        if (e.button === 2) return; // Ignore right-click on pointerdown
        isDragging = true;
        isAnimatingFlip = false;
        startX = e.clientX;
        startY = e.clientY;
        initialRotY = rotY;
        initialRotX = rotX;
        dragDistance = 0;
        scene.setPointerCapture(e.pointerId);
      });

      scene.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        dragDistance = Math.hypot(deltaX, deltaY);

        // Direct 1:1 natural rotation tracking
        rotY = initialRotY + deltaX * 0.65;
        rotX = Math.max(-60, Math.min(60, initialRotX - deltaY * 0.45));
        
        targetRotY = rotY;
        targetRotX = rotX;
        updateTransform();
      });

      function onPointerEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        try {
          scene.releasePointerCapture(e.pointerId);
        } catch (_) {}

        // If drag was essentially zero, treat as single tap -> smooth 180° flip
        if (dragDistance < 7) {
          trigger180Flip();
        }
        // If it was a drag, card permanently freezes exactly where finger was lifted!
      }

      scene.addEventListener('pointerup', onPointerEnd);
      scene.addEventListener('pointercancel', onPointerEnd);

      // Desktop Right-Click Flip
      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        trigger180Flip();
      });

      function trigger180Flip() {
        isAnimatingFlip = true;
        // Determine whether to snap towards nearest 180° interval
        const currentRot = targetRotY;
        const remainder = Math.round(currentRot / 180) * 180;
        
        // If already flat on one side, rotate forward 180°
        if (Math.abs(currentRot - remainder) < 15) {
          targetRotY = remainder + 180;
        } else {
          targetRotY = remainder;
        }
        targetRotX = 0; // Return tilt to level on tap
      }

      // Files Modal Trigger Logic
      filesBtn.addEventListener('click', () => {
        modalBackdrop.classList.add('open');
      });

      closeBtn.addEventListener('click', () => {
        modalBackdrop.classList.remove('open');
      });

      modalBackdrop.addEventListener('click', (e) => {
        if (!modalPanel.contains(e.target)) {
          modalBackdrop.classList.remove('open');
        }
      });

      // Escape key to close modal
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) {
          modalBackdrop.classList.remove('open');
        }
      });
    })();
  </script>
</body>
</html>
